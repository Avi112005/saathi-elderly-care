name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./saathi.db
      REMINDER_SCHEDULER: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm audit --omit=dev --audit-level=high
      - run: npx prisma db push --skip-generate && npm run db:seed
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: End-to-end + accessibility (axe)
        run: npm run test:e2e -- --project=desktop
        env:
          CI: "true"
